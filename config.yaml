# Предмети, які завжди вважаються "творчими" (есе, твори, аналіз) навіть
# якщо в тексті ДЗ згадана сторінка підручника — там сторінка вказує на
# матеріал для читання/натхнення, а не на приклад/вправу для копіювання.
#
# ВИДАЛЕНО (2026-09-09) "Зарубіжна література" і "Українська  література":
# обидва мають РЕАЛЬНО налаштований textbooks[subject] (і gdz_sources для
# укр.) — перебування в цьому списку повністю блокувало
# _condition_from_textbook_pdf() для них (solver.py:
# classify_task()!="textbook" -> LLM одразу без жодного тексту з
# підручника), тому реальне ДЗ "Опрацювати ст.3-10, виписати ознаки
# реалізму" завжди йшло на LLM голим текстом ДЗ і той чесно писав "не маю
# тексту параграфа" — хоча текст твору фактично був на disk. Задум
# коментаря вище (не порівнювати з ГДЗ есе/творчі відповіді) не вимагає
# ПОВНОГО відключення PDF — Book4Source і так не знаходить "відповідь" на
# завдання без чіткого номера вправи, просто мовчки повертає None.
# Реальний баг знайдений і виправлений 2026-09-09.
creative_subjects:
  - "Мистецтво"
  - "Музичне мистецтво"
  - "Образотворче мистецтво"
  - "Художня культура"

# solver.py -> is_review_only(): ДЗ типу "повторити конспект/матеріал" не
# потребує розгорнутого пояснення від LLM — його можна пропустити (source
# "skipped"), якщо тільки в тексті НЕ згадана оцінювана робота (контрольна/
# самостійна/тест/залік/атестація) — тоді, навпаки, потрібен чекліст тем
# для підготовки (review_keywords спрацював, assessment_keywords теж).
review_keywords:
  - "повторити"
  - "повторення матеріалу"
  - "переглянути конспект"
  - "прочитати ще раз"

# Простий підрядковий пошук (без відмінювання) — тому декілька відмінкових
# форм додані явно (напр. "контрольною", "контрольної"). Додай ще форми
# сюди, якщо трапиться пропущений варіант у щоденнику.
assessment_keywords:
  - "контрольна"
  - "контрольну"
  - "контрольної"
  - "контрольною"
  - "самостійна робота"
  - "самостійну роботу"
  - "тест"
  - "залік"
  - "атестація"

# solver.py -> classify_task(): ДЗ, що явно просить НАПИСАТИ готовий текст
# (а не розв'язати вправу) — окрема категорія "write_task", mode="write"
# (LlmSolver.solve) видає готовий текст твору/есе, а не план/пояснення.
# Перевіряється ПЕРШИМ, незалежно від предмету/наявності сторінки підручника.
write_task_keywords:
  - "твір"
  - "твір-опис"
  - "твір-роздум"
  - "есе"
  - "написати текст"
  - "скласти розповідь"
  - "написати розповідь"
  - "написати переказ"

# Вибір LLM-провайдера для розв'язування ДЗ (solver.py -> LlmSolver).
# default_provider — коли для предмету немає запису в overrides.
# Groq — швидший, безкоштовний тір без картки, дефолт для більшості предметів.
# Gemini (2.5 flash) — для точних наук, де він краще дає раду з математикою.
# Модель кожного провайдера — дефолт, зашитий у відповідний клас у solver.py
# (GroqProvider: openai/gpt-oss-120b, GeminiProvider: gemini-2.5-flash).
# Groq регулярно змінює/знімає з підтримки моделі безкоштовного тіру —
# якщо GroqProvider почне падати з "model_not_found", перевір актуальний
# список: client.models.list() на base_url=https://api.groq.com/openai/v1.
llm:
  default_provider: groq
  # УВАГА: ключі overrides/textbooks нижче мають ТОЧНО збігатися з назвою
  # предмету, як її віддає nz.ua (task.subject), а не зі скороченою назвою
  # "як заведено казати" — щоденник називає математику повними назвами
  # "Математика. Алгебра і початки аналізу" / "Математика. Геометрія", не
  # просто "Математика". Перевірено наживо на реальному /week
  # (2026-09-06) — ключ "Математика" тут раніше НІКОЛИ не спрацьовував
  # (solver.py -> _resolve_provider_and_model робить точний dict-lookup за
  # task.subject, без підрядкового пошуку), тож override на gemini для
  # математики тихо ігнорувався від самого початку.
  overrides:
    Математика. Алгебра і початки аналізу: gemini
    Математика. Геометрія: gemini
    Фізика: gemini
  # solver.py -> LlmSolver.solve(): якщо обраний провайдер (default_provider/
  # overrides вище) падає з rate-limit/quota (429/RESOURCE_EXHAUSTED) — пробує
  # по черзі решту з цього списку (дублікат обраного провайдера пропускається
  # автоматично). Якщо впали ВСІ — користувач бачить коротке "недоступно,
  # спробуй пізніше", без сирого exception/JSON.
  #
  # cerebras ВИДАЛЕНО (2026-09-07): живий тест дав спершу 404 (застарілий
  # model ID з документації), після виправлення на реально доступну модель
  # — 402 Payment Required (акаунт вимагає білінг/верифікацію попри
  # рекламоване "безкоштовно без картки"). CerebrasProvider повністю
  # видалений з solver.py (не лишений закоментованим).
  #
  # _fallback_chain() завжди ставить УЖЕ ОБРАНОГО провайдера першим, далі —
  # решту зі списку нижче в цьому порядку (дублікати пропускаються). Тобто
  # для Математики/Фізики (override -> gemini) ланцюжок виходить
  # [gemini, zai, groq, ovh, cloudflare]; для решти предметів
  # (default_provider: groq) — [groq, zai, gemini, ovh, cloudflare].
  #
  # zai — ПЕРШИЙ у fallback_order (не рахуючи override): живий тест
  # 2026-09-07 підтвердив реальну коректну відповідь. groq/gemini —
  # перевірені й робочі з самого початку проєкту. ovh — робочий протокол
  # (підтверджено справжнім 429, не помилкою формату), але 2 запити/хв
  # анонімно роблять його ненадійним основним вибором. cloudflare — В КІНЦІ
  # навмисно, "організатор про запас": токен поки без прав на Workers AI
  # (403), підключиться сам, щойно права з'являться — спрацьовує лише якщо
  # ВСІ інші в ланцюжку вже впали.
  fallback_order:
    - zai
    - groq
    - gemini
    - ovh
    - cloudflare
  # solver.py -> _get_llm_semaphore: максимум ОДНОЧАСНИХ мережевих
  # LLM-викликів у всьому процесі (не GDZ/PDF) — незалежно від того,
  # скільки предметів/під-вправ (Task) розв'язується паралельно вище
  # (telegram_bot.py -> _SOLVE_CONCURRENCY, і _solve_multi_exercise для
  # кількох номерів в одному предметі). Додано 2026-09-08 (промт 44) —
  # без цього ліміту сплеск паралельних Task міг би вдарити по rate-limit
  # одного провайдера швидше, ніж послідовна обробка.
  max_concurrent_calls: 6

# textbook_source.py — PRIMARY джерело умови задачі: пряме завантаження
# PDF підручника (напр. з pidruchnyk.com.ua) і витягування тексту вправи
# за номером (extract_exercise_condition). null = підручник не вказано ->
# LLM працює лише з коротким записом із щоденника (з попередженням у лог).
#
# ВАЖЛИВО: значення — ПРЯМИЙ URL PDF-файлу підручника, а не сторінки ГДЗ.
# PDF набагато надійніший за скани ГДЗ: перевірено наживо (2026-09-05) — на
# №1.13 з Мерзляка OCR зі скану дав неоднозначне "2•2n" (не зрозуміло, чи це
# 2·2ⁿ чи 4n), тоді як текст із PDF однозначно каже "A = {x | x = 4n}".
#
# Кешується локально в textbook_cache_dir (нижче) — при повторному запуску
# файл не перезавантажується.
textbooks:
  # ВИПРАВЛЕНО (2026-09-06): попередні два окремих файли (профільний рівень
  # Мерзляка — окремі Алгебра/Геометрія) були НЕ тим підручником, за яким
  # реально вчиться учень — рівень СТАНДАРТУ, ОДНА комбінована книга на
  # Алгебру й Геометрію разом: https://pidruchnyk.com.ua/1153-matematyka-10-klas-merzlyak.html
  # Підтверджено регресійним тестом: реальне ДЗ "Вивчити пункт 27, розв'язати
  # №27.5-27.8" — §27 "Просторові фігури..." з §4 "Паралельність у просторі"
  # ДІЙСНО є в цьому файлі, вправи 27.1-27.16 знайдені й коректно витягнуті
  # extract_exercise_condition() (у профільній Геометрії й поглибленій —
  # §27 не існувало взагалі, звідси й була попередня плутанина).
  #
  # УВАГА: №1.13 у ЦЬОМУ (стандарт) файлі — ІНША задача (доведення парності
  # функції), ніж №1.13 у старому профільному файлі (переріз множин), який
  # тестувався раніше в цій сесії. Різні рівні складності = різний вміст
  # під тим самим номером — якщо колись знову зʼявляться сумніви щодо
  # правильності підручника, звіряй номер/тему з реальним завданням, не з
  # тим, що спрацювало раніше на іншому рівні.
  Математика. Алгебра і початки аналізу: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-matematika-merzljak-2018.pdf"
  Математика. Геометрія: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-matematika-merzljak-2018.pdf"

  # Нижче — 10 предметів, перевірених наживо 2026-09-06 (curl -I: статус
  # 200, Content-Type: application/pdf на files.pidruchnyk.com.ua). ЖОДЕН
  # з них не використовує крапковий формат Мерзляка ("N.M.") — усі мають
  # наскрізну нумерацію "N." (textbook_source.py -> extract_exercise_condition
  # тепер підхоплює обидва формати автоматично за наявністю крапки в
  # номері). Назви предметів нижче — ТІЛЬКИ ті 7, що вже підтверджені
  # реальним /week (позначено "підтверджено"); решта 4 — найімовірніша
  # повна назва за зразком підтверджених (позначено "перевір з першого ДЗ")
  # — nz.ua віддає повні офіційні назви предметів, не скорочені розмовні.

  Фізика: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-fizyka-barjakhtar-2018.pdf"  # підтверджено /week
  Історія України: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-istoriia-ukraiiny-sorochynska-2018.pdf"  # підтверджено /week
  Всесвітня історія: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-vsesvitnja-istorija-poljanskij-2018.pdf"  # підтверджено /week
  Українська мова: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-ukrajinska-mova-avramenko-2018.pdf"  # підтверджено /week
  # УВАГА: подвійний пробіл в імені ключа нижче — НЕ помилка, це точна
  # копія реального рядка з nz.ua (артефакт скрейпінгу, перевірено в логах
  # /week 2026-09-06). Точний lookup за task.subject не пробачає розбіжність
  # навіть в один пробіл (та сама причина, чому override "Математика" на
  # gemini мовчки не спрацьовував раніше — див. llm.overrides вище).
  Українська  література: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-ukrajinska-literatura-avramenko-2018.pdf"  # підтверджено /week

  Хімія: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-khimija-savchin-2018.pdf"  # перевір з першого ДЗ
  Біологія і екологія: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-biologija-sobol-2018.pdf"  # перевір з першого ДЗ
  Зарубіжна література: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-zarubizhna-literatura-nikolenko-2018.pdf"  # перевір з першого ДЗ
  Географія: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-geografija-gilberg-2018.pdf"  # перевір з першого ДЗ
  Громадянська освіта: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-gromadjanska-osvita-verbicka-2018.pdf"  # перевір з першого ДЗ
  # УВАГА: предмет перейменований у програмі — nz.ua віддає "Захист
  # України" (перевірено наживо 2026-09-09), а не стару назву "Захист
  # Вітчизни". Ключ нижче — актуальна назва; підручник (Лелека) все ще
  # виданий під старою назвою предмета, це нормально, файл той самий.
  Захист України: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-zahyst-vitchyzny-leleka-2018.pdf"  # перевір з першого ДЗ

  # Карпюк, 10 клас, 2018 — це УКРАЇНСЬКИЙ МОН-затверджений підручник
  # (навчає англійської як іноземної, але сам підручник — вітчизняне
  # видання), тому легально й безкоштовно поширюється через той самий
  # державний канал pidruchnyk.com.ua, що й решта підручників тут — НЕ
  # копірайтний закордонний "Student's Book" з платної видавничої
  # платформи (Oxford/Cambridge тощо), той підключати НЕ став би.
  Англійська мова: "https://files.pidruchnyk.com.ua/uploads/book/10-klas-anglijska-mova-karpjuk-2018.pdf"  # перевір з першого ДЗ

  # ... інші предмети додамо як з'являться в щоденнику (перевіряй ТОЧНУ
  # назву з реального /week в логах — nz.ua віддає повні назви, не скорочені)

# solver.py -> Book4Source: ОКРЕМЕ від textbooks джерело — сторінка книги
# на ГДЗ-сайті (4book.org тощо), звідки береться ГОТОВА ВІДПОВІДЬ для
# звірки з LLM-розв'язком (textbooks вище — джерело УМОВИ задачі, це
# різне призначення тому й різна секція). Book4Source.search() тепер
# завжди запускається ПАРАЛЕЛЬНО з LLM (solve_task, concurrent.futures),
# не як фолбек — якщо для предмету тут немає запису, звірка просто
# пропускається (лишається тільки LLM), solve_task не падає.
#
# Перевірено наживо 2026-09-07: навігація на 4book.org трирівнева (книга ->
# тема з діапазоном "№ 27.1-28.15" в тексті посилання -> сторінка з
# пагінацією "27.5-27.7"/"27.8"/... і відповіддю-сканом) — той самий
# формат, під який Book4Source уже написаний, жодних змін навігації не
# знадобилось, лише правильний URL книги.
#
# Перевірено наживо 2026-09-07 на 3 сайтах (4book.org, freegdz.com,
# vshkole.com) для ВСІХ 11 предметів з textbooks — детальний звіт покриття
# в README.md. Коротко: 4 предмети РЕАЛЬНО знайдені (той самий автор/рік,
# що й textbooks вище) і додані нижче; 2 знайдені лише під ІНШИМ виданням/
# роком (не той самий підручник — не підключаю, щоб не звіряти з
# заздалегідь невідповідним джерелом); 5 не знайдені на жодному з 3 сайтів
# взагалі — для них лишається тільки LLM, без звірки.
gdz_sources:
  Математика. Алгебра і початки аналізу: "https://4book.org/gdz-reshebniki-ukraina/10-klas/reshebnik-matematika-10-klas-merzlyak-2018-gdz"
  Математика. Геометрія: "https://4book.org/gdz-reshebniki-ukraina/10-klas/reshebnik-matematika-10-klas-merzlyak-2018-gdz"
  Біологія і екологія: "https://4book.org/gdz-reshebniki-ukraina/10-klas/gdz-biologiya-i-ekologiya-10-klas-sobol-2018"
  Всесвітня історія: "https://4book.org/gdz-reshebniki-ukraina/10-klas/vidpovidi-vsesvitnya-istoriya-10-klas-polyanskiy-gdz"
  Українська мова: "https://4book.org/gdz-reshebniki-ukraina/10-klas/gdz-ukrayinska-mova-10-klas-avramenko-2018"
  Українська  література: "https://4book.org/gdz-reshebniki-ukraina/10-klas/gdz-ukrayinska-literatura-10-klas-avramenko-2018"

# Куди кешувати завантажені PDF підручників (textbook_source.download_textbook).
textbook_cache_dir: "./.textbook_cache"

# Book4Source (solver.py) — скрепер 4book.org, тепер ДРУГОРЯДНА/опційна
# звірка ФІНАЛЬНОЇ ВІДПОВІДІ (не умови — умову дає textbooks вище). УВАГА:
# оскільки textbooks[subject] тепер зберігає URL PDF, а не сторінки ГДЗ,
# Book4Source більше не має звідки брати свій book_url — search() коректно
# повертає None (безпечно, не падає), але фактично не спрацьовує, поки
# для нього не заведуть окремий config-ключ з реальними ГДЗ-URL (як було
# раніше — див. приклади URL нижче для довідки, якщо схочеш повернути).
#
# Й НАЙГОЛОВНІШЕ (перевірено наживо 2026-09-05 на алгебрі/укр.мові/історії):
# відповіді на 4book.org — це СКАНОВАНІ ЗОБРАЖЕННЯ, не текст. Book4Source
# коректно знаходить потрібну сторінку/вправу, OCR-ить (Gemini Vision) і
# звіряє з LLM-відповіддю — це і є "confidence=high"/"gdz+llm" шлях.

# BrowserChatProvider (solver.py) — автоматизація веб-чату через Playwright
# ЗАМІСТЬ офіційного API. НЕ ПРАЦЮЄ для deepseek/gemini (перевірено
# 2026-09-05): CloudFront 403 на DeepSeek, Google блокує automation-флаги на
# рівні OAuth-логіну, а сам Chrome відмовляється вмикати CDP на дефолтному
# профілі користувача. Лишається в коді задокументованою, але непрацездатною
# опцією — не використовується, поки хтось не знайде реальний обхід і не
# оновить цей файл. УВАГА: це й так порушувало ToS цих сервісів.
#
# Перед використанням (якщо колись запрацює) — залогинься вручну в профіль:
#   python setup_browser_profile.py --service deepseek
#   python setup_browser_profile.py --service gemini
browser_chat:
  headless: false   # true лише коли профіль вже стабільно залогінений — headless частіше ловить антибот-блокування
  channel: "chrome" # реальний встановлений Google Chrome (не Playwright-bundled Chromium) — /opt/google/chrome/
  wait_timeout: 60          # секунд максимум чекати відповідь
  poll_interval: 1.5        # секунд між перевірками "чи текст ще змінюється"
  stable_checks: 2          # скільки поспіль однакових знімків тексту = "готово"
  input_ready_timeout: 20   # секунд чекати на появу поля вводу (одна спроба)
  input_ready_retries: 3    # скільки разів повторити очікування поля вводу

  services:
    # Знято наживо з реальної залогіненої сторінки (2026-09-01):
    # - поле вводу: <textarea placeholder="Message DeepSeek">
    # - редірект на /sign_in, якщо сесія не активна
    # - КЛАСИ ПОВІДОМЛЕНЬ У DeepSeek ХЕШОВАНІ (напр. "_3098d02") і міняються
    #   з кожним білдом — response_container_selector навмисно не задано,
    #   код падає на фолбек: різниця тексту всієї сторінки до/після відправки.
    deepseek:
      url: "https://chat.deepseek.com"
      user_data_dir: "./.browser_profiles/deepseek"
      input_selector: 'textarea[placeholder="Message DeepSeek"]'
      submit_key: "Enter"
      response_container_selector: null
      login_form_selector: 'input[type="password"]'
      login_url_pattern: "/sign_in"

    # Google AI Studio (aistudio.google.com) — НЕ gemini.google.com:
    # останній без логіну показує маркетинговий лендінг, а не чат, і має
    # свої проблеми з доступом в окремих акаунтах/регіонах. AI Studio —
    # той самий Gemini, стабільніша Angular Material розмітка.
    # Знято наживо (2026-09-01), залогінений акаунт:
    # - поле вводу: <textarea aria-label="Enter a prompt">
    # - відправка: Ctrl+Enter (звичайний Enter додає новий рядок)
    # - відповідь: останній <ms-text-chunk> всередині останнього <ms-chat-turn>
    #   (це кастомні Angular-елементи, не хешовані CSS-класи — набагато
    #   стабільніші за DeepSeek)
    # - логін вимагає акаунт Google, редірект на accounts.google.com
    gemini:
      url: "https://aistudio.google.com/prompts/new_chat"
      user_data_dir: "./.browser_profiles/gemini"
      input_selector: 'textarea[aria-label="Enter a prompt"]'
      submit_key: "Control+Enter"
      response_container_selector: "ms-chat-turn ms-text-chunk"
      login_form_selector: 'input[type="email"]'
      login_url_pattern: "accounts.google.com"
